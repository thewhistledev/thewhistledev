<svg xmlns="http://www.w3.org/2000/svg" width="620" height="220" viewBox="0 0 620 220" role="img" aria-label="Engineering focus for thewhistledev">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="620" height="220" rx="18" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="618.5" height="218.5" rx="17.25" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="74" cy="186" r="66" fill="#22d3ee" opacity="0.08" filter="url(#glow)"/>
  <circle cx="558" cy="34" r="68" fill="#8b5cf6" opacity="0.10" filter="url(#glow)"/>

  <rect x="24" y="23" width="4" height="32" rx="2" fill="url(#accent)"/>
  <text x="42" y="45" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Engineering focus</text>
  <text x="42" y="65" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">systems, tooling and software that exposes what is actually happening</text>

