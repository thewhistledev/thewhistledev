      <circle cx="20" cy="21.5" r="5" fill="#f59e0b"/>
      <text x="34" y="27" fill="#e6edf3" font-size="13" font-weight="600">Automation</text>
    </g>
    <g transform="translate(402 147)">
      <rect width="194" height="43" rx="11" fill="#161b22" stroke="#30363d"/>
      <circle cx="20" cy="21.5" r="5" fill="#60a5fa"/>
      <text x="34" y="27" fill="#e6edf3" font-size="13" font-weight="600">Reverse Engineering</text>
