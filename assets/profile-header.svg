<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070A10"/>
      <stop offset="0.55" stop-color="#0C101A"/>
      <stop offset="1" stop-color="#070A10"/>
    </linearGradient>
    <linearGradient id="accent" x1="210" y1="100" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.48" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(235 120) rotate(30) scale(390 240)">
      <stop stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(970 260) rotate(-150) scale(420 250)">
      <stop stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glowA)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glowB)"/>

  <circle cx="1070" cy="82" r="74" fill="#8B5CF6" fill-opacity="0.08" filter="url(#blur)"/>
  <circle cx="112" cy="300" r="84" fill="#22D3EE" fill-opacity="0.07" filter="url(#blur)"/>

  <g opacity="0.7">
    <circle cx="64" cy="58" r="4" fill="#22D3EE"/>
    <circle cx="82" cy="58" r="4" fill="#8B5CF6"/>
    <circle cx="100" cy="58" r="4" fill="#EC4899"/>
  </g>

  <text x="72" y="156" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="8">NOOT</text>
  <rect x="72" y="178" width="470" height="4" rx="2" fill="url(#accent)"/>
  <text x="72" y="222" fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" font-weight="500" letter-spacing="1.2">@thewhistledev</text>
  <text x="72" y="271" fill="#CBD5E1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21" font-weight="400">Software • systems • security tooling • game tech • experiments</text>

