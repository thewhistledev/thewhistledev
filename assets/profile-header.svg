    <text x="28" y="45" fill="#64748B" font-family="Consolas, Menlo, monospace" font-size="15">$ whoami</text>
    <text x="28" y="78" fill="#E2E8F0" font-family="Consolas, Menlo, monospace" font-size="17">builder</text>
    <text x="28" y="105" fill="#E2E8F0" font-family="Consolas, Menlo, monospace" font-size="17">developer</text>
